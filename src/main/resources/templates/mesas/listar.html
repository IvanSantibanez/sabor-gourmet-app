<!DOCTYPE html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/master}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sabor Gourmet - Listar Mesas</title>
  </head>

  <body>
    <div class="row mt-5" layout:fragment="page-content">
      <h2 class="text-center">Lista de mesas</h2>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div class="d-flex justify-content-center p-5">
        <a class="btn btn-success" th:href="@{/mesas/agregar}">Agregar Mesa</a>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Número de mesa</th>
            <th scope="col">Capacidad</th>
            <th scope="col">Tipo de Mesa</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="mesa : ${mesas}">
            <td th:text="${mesa.numero}"></td>
            <td th:text="${mesa.capacidad}"></td>
            <td th:text="${mesa.tipo}"></td>
            <td>
              <div class="d-flex gap-2">
                <a
                  class="btn btn-primary"
                  th:href="@{'/mesas/editar/' + ${mesa.id}}"
                  >Editar</a
                >
                <a
                  class="btn btn-danger"
                  th:href="@{'/mesas/eliminar/' + ${mesa.id}}"
                  th:onclick="|return confirm('¿Está seguro que desea eliminar la mesa número ${mesa.numero}?');"
                >
                  Eliminar
                </a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
